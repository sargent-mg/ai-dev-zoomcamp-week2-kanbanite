[project]
name = "backend"
version = "0.1.0"
description = "Mock FastAPI backend for Kanbanite"
readme = "README.md"
authors = [
    { name = "Adrián López Rendón", email = "sargent.mg@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
]

[project.scripts]
backend = "backend.app:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
